name: Validate

on: [ pull_request ]

jobs:
  typescript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Node 22 bundles npm 10, which ignores min-release-age (.npmrc) and is
      # rejected by engines.npm + engine-strict. Keep in sync with packageManager.
      - run: npm install -g npm@12.2.0

      - run: npm ci

      - name: Typescript check
        run: npm run ts:check
 
      - name: ESlint check
        uses: sibiraj-s/action-eslint@5af82bfa2a6b0cc7cba3208d6274724977caefbd # v2.2.1
        with:
          eslint-args: '--ignore-path=.gitignore --quiet'
          extensions: 'md,ts,tsx'
          annotations: true

