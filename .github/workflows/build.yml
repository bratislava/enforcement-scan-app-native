on:
  push:
    tags:
      - 'prod**'
      - 'staging**'
      - 'dev**'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_UPDATE_MESSAGE: '${{ github.event.ref }} ${{ github.event.head_commit.message }}'
    steps:
      - name: 🚂 Setup repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🚛 Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - name: 🚧 Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 22.6.0
          token: ${{ secrets.EXPO_BUILD_TOKEN }}

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🏷 Set version from tag
        run: |
          VERSION="$(echo "$GITHUB_REF_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' contains no x.y.z version"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            staging*) VERSION="$VERSION-rc" ;;
            dev*) VERSION="$VERSION-dev" ;;
          esac
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          echo "Building version $VERSION"

      - name: 🚀 Build production
        if: contains(github.event.ref, 'prod') && !contains(github.event.ref, 'ota')
        run: |
          eas build --profile prod --platform android --auto-submit --non-interactive
          eas build --profile prod-apk --platform android --non-interactive

      - name: 🚀 Update production
        if: contains(github.event.ref, 'prod') && contains(github.event.ref, 'ota')
        run: eas update --message "$EXPO_UPDATE_MESSAGE" --branch prod --platform android --non-interactive --clear-cache

      - name: 🚀 Build staging
        if: contains(github.event.ref, 'staging')
        run: |
          eas build --profile staging --platform android --auto-submit --non-interactive
          eas build --profile staging-apk --platform android --non-interactive

      - name: 🚀 Build development
        if: startsWith(github.event.ref, 'refs/tags/dev')
        run: eas build --profile development --platform android --non-interactive
