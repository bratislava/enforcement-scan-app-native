appId: com.bratislava.enforcement
---
- launchApp
- waitForAnimationToEnd
# Set location to Dunajska street
- setLocation:
    latitude: 48.150636
    longitude: 17.111754
- assertVisible:
    id: paas
- tapOn:
    id: paas
- assertVisible: Vyberte úsek
- swipe:
    direction: RIGHT
- waitForAnimationToEnd
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- assertVisible:
    id: userLocationButton
- tapOn:
    id: userLocationButton
- extendedWaitUntil:
    visible: Pokračovať
    timeout: 10000
- tapOn: Pokračovať
# Will check the sign screen and wait for the preselected zone sign
- assertVisible: Vyberte značku
- extendedWaitUntil:
    visible:
      id: selectedZoneSign
    timeout: 10000
# Will wait for today's photos (Continue becomes enabled, or the today photo buttons appear)
- extendedWaitUntil:
    notVisible:
      id: confirmZoneSign
      enabled: false
    timeout: 10000
# Sign already photographed today: reuse that photo
- runFlow:
    when:
      visible:
        id: useZonePhoto
    commands:
      - tapOn:
          id: useZonePhoto
# No photo of the sign today: open the camera
- runFlow:
    when:
      visible:
        id: confirmZoneSign
    commands:
      - tapOn:
          id: confirmZoneSign
# Will add zone photo (the reused photo is shown without the camera)
- runFlow:
    when:
      visible:
        id: takePicture
    commands:
      - tapOn:
          id: takePicture
- extendedWaitUntil:
    visible:
      id: confirmPicture
    timeout: 10000
- tapOn:
    id: confirmPicture
- tapOn: Evidenčné číslo vozidla
- inputText: SM01RK1
- tapOn: Ďalej
# Will consider resident as no violation
- assertVisible:
    id: NO_VIOLATION
- eraseText
- inputText: AAAAAAA
- tapOn: Ďalej
- assertNotVisible:
    id: NO_VIOLATION
- tapOn: Ďalej
- tapOn: Pokračovať
- runFlow:
    when:
      visible: Duplicita
    commands:
      - tapOn: Vytvoriť hlásenie
- assertVisible: Detail vozidla
- tapOn: Pokračovať
- repeat:
    times: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: takePicture
            enabled: true
          timeout: 10000
      - tapOn:
          id: takePicture
# Will create offence
- tapOn:
    id: createOffence
- extendedWaitUntil:
    visible:
      id: newScan
    timeout: 10000
- tapOn:
    id: newScan
- tapOn: Evidenčné číslo vozidla
- inputText: AAAAAAA
- tapOn: Ďalej
# Will consider as duplicity
- assertVisible:
    id: PAAS_PARKING_VIOLATION_DUPLICITY
- tapOn: Ďalej
- tapOn: Pokračovať
# Will show duplicity modal
- assertVisible: Duplicita
